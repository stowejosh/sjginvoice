<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice – Stowe Josh Graphics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c1:#00cbdb; --c2:#004fc3; --blue:#0052c6; --lblue:#1a74bb; --tint:#f2f6fc;
  --page:#eef1f6; --bar:#fff; --bar-ink:#14213d; --line:#d6dce8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#12161d;--bar:#1b212c;--bar-ink:#e8eefb;--line:#333c4d}
}
:root[data-theme="dark"]{--page:#12161d;--bar:#1b212c;--bar-ink:#e8eefb;--line:#333c4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--bar-ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.bar button{font:600 13px "Montserrat",system-ui,sans-serif;padding:9px 14px;border-radius:8px;border:1px solid var(--blue);background:transparent;color:var(--bar-ink);cursor:pointer}
.bar button.primary{background:var(--blue);color:#fff}
.wrap{padding:18px 10px 40px}

.sheet{container-type:inline-size;width:min(100%,900px);margin:0 auto;background:#fff;color:var(--blue);box-shadow:0 6px 30px rgba(0,0,0,.2);overflow:hidden}
.sheet input,.sheet textarea{font:inherit;color:inherit;background:transparent;border:0;outline:0;width:100%;padding:0;margin:0;border-radius:.4cqw;text-overflow:ellipsis}
.sheet input:hover,.sheet input:focus{background:rgba(255,255,255,.18);box-shadow:0 0 0 .25cqw rgba(255,255,255,.55)}
.body input:hover,.body input:focus{background:rgba(10,82,196,.07);box-shadow:0 0 0 .25cqw rgba(10,82,196,.35)}

.head{background:linear-gradient(100deg,var(--c1),var(--c2));color:#fff;padding:3.5cqw 0 3.5cqw}
.top{display:flex;justify-content:space-between;padding:0 5cqw 0 5.9cqw}
.top img{height:11.4cqw;width:auto;display:block}
.contact{text-align:right;font-size:1.85cqw;line-height:3.9cqw;padding-top:1.2cqw}
.rule{height:.15cqw;background:#fff;margin:1.7cqw 5.4cqw 0}
.big{font-size:8.9cqw;line-height:1;font-weight:800;margin:.8cqw 0 0 6.4cqw;letter-spacing:-.01em}
.billed{font-size:1.95cqw;font-weight:400;margin:.8cqw 0 1cqw 7.9cqw;line-height:2.4cqw}
.info{position:relative;padding-left:7.9cqw;display:grid;grid-template-columns:25.8cqw 28cqw;row-gap:1.6cqw}
.lbl{font-size:1.95cqw;font-weight:400;line-height:2.6cqw;margin:0}
.val{font-size:2.15cqw;font-weight:600;line-height:2.8cqw;display:block}
.box{position:absolute;right:7.5cqw;top:0;width:23.7cqw;height:12.4cqw;background:rgba(255,255,255,.2);border-radius:1.3cqw;padding:2.1cqw 2.5cqw 0 1cqw;text-align:right}
.box::before{content:"";position:absolute;left:-1.6cqw;top:7cqw;border-right:1.7cqw solid rgba(255,255,255,.2);border-top:1.1cqw solid transparent;border-bottom:1.1cqw solid transparent}
.box .t{font-size:1.95cqw;line-height:2.4cqw;font-weight:400}
.box .n{font-size:3.9cqw;line-height:4.2cqw;font-weight:700;margin-top:.4cqw}

.body{padding:0 5.8cqw 0 5.95cqw}
.th,.tr{display:grid;grid-template-columns:41% 22.7% 14% 22.3%;align-items:start}
.th{font-weight:700;font-size:2.15cqw;padding:6.1cqw 0 2.6cqw;line-height:2.6cqw}
.th div:first-child{padding-left:2cqw}
.th div:not(:first-child){text-align:center}
.rows{position:relative}
.tr{height:9.2cqw;font-weight:600;font-size:2.15cqw;position:relative;padding-top:2.1cqw;line-height:2.8cqw}
.tr:nth-child(odd){background:var(--tint)}
.tr .d{padding-left:2cqw;padding-right:1cqw}
.tr .d .s{font-weight:400;font-size:1.95cqw;color:var(--lblue)}
.tr .c{display:flex;justify-content:center;gap:.5cqw}
.tr .c input{width:9.5cqw}
.tr .q input{width:100%;text-align:center}
.tr .a{text-align:center}
.tr .del{position:absolute;right:.5cqw;top:50%;transform:translateY(-50%);width:3cqw;height:3cqw;border-radius:50%;border:0;background:#fff;color:#b3261e;font:700 2cqw/1 "Montserrat",sans-serif;cursor:pointer;padding:0;box-shadow:0 0 0 .2cqw #e3b9b5}

.foot{display:flex;justify-content:space-between;margin-top:3.3cqw}
.pay{padding-left:2cqw;width:52%;font-size:2.15cqw;font-weight:600;line-height:3.25cqw}
.pay .lbl{color:var(--lblue);font-size:1.95cqw;line-height:3.25cqw}
.pay input{display:block;line-height:3.25cqw}
.tot{width:31.4cqw;display:grid;grid-template-columns:1fr 13cqw;column-gap:4.7cqw;row-gap:0;font-size:2.15cqw;font-weight:700;line-height:3.95cqw;align-content:start}
.tot .k{text-align:right}
.tot .k.sel{display:flex;justify-content:flex-end;align-items:center}
.tot .k.sel::after{content:"▾";font-size:1.6cqw;margin-left:.3cqw;pointer-events:none}
.tot .k select{font:inherit;color:inherit;background:transparent;border:0;outline:0;-webkit-appearance:none;appearance:none;cursor:pointer;padding:0 .2cqw;margin:0;border-radius:.4cqw;text-align:right}
.tot .k select:hover,.tot .k select:focus{background:rgba(10,82,196,.07);box-shadow:0 0 0 .25cqw rgba(10,82,196,.35)}
.tot .k select option{color:#000;background:#fff;font-weight:600}
.tot .v{display:flex;align-items:center}
.tot .v input{width:10cqw}
.sign{margin:5cqw 0 0 .5cqw;width:14.5cqw}
.sign img{display:block;width:100%;height:auto}
.sign p{margin:.6cqw 0 0 .8cqw;font-size:1.85cqw;font-weight:600;color:var(--lblue)}
.endbar{height:1.5cqw;background:linear-gradient(90deg,var(--c1),var(--c2));margin:1.6cqw 0 3.8cqw}

body.preview .del,body.preview .no-print{display:none!important}
body.preview .sheet input,body.preview .sheet textarea,body.preview .sheet select{pointer-events:none}
body.preview .tot .k.sel::after{display:none}
body.preview .sheet input:hover{background:transparent;box-shadow:none}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar,.del{display:none!important}
  .wrap{padding:0}
  .sheet{width:100%;box-shadow:none}
  .sheet input:hover,.sheet input:focus{background:transparent!important;box-shadow:none!important}
  .tot .k.sel::after{display:none}
  .tot .k select:hover,.tot .k select:focus{background:transparent!important;box-shadow:none!important}
}
</style>
</head>
<body>
<div class="bar">
  <button class="primary" id="add">+ Add item</button>
  <button id="newInv">New invoice</button>
  <button id="preview">Preview</button>
  <button id="print">Print / Save PDF</button>
  <button id="reset">Reset</button>
</div>

<script>
(function(){
  var KEY="stowejosh-invoice-v1";
  var DEFAULTS={name:"Esem",phone:"08105424840",date:"13/08/2026",inv:"SJG00492",
    items:[{item:"Logo Design",sub:"Single Logo",cost:5000,qty:2}],
    payName:"Stowe Josh Graphics",acct:"1028225325",bank:"United Bank for Africa (UBA)",tax:0,taxMode:"tax",nextSeq:100};
  var FIELDS=["name","phone","date","inv","payName","acct","bank","taxMode"];
  var S;
  try{var raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):null;}catch(e){S=null;}
  if(!S||!S.items)S=JSON.parse(JSON.stringify(DEFAULTS));
  if(!S.nextSeq)S.nextSeq=100;
  if(S.taxMode===undefined)S.taxMode="tax";

  var $=function(id){return document.getElementById(id)};
  var num=function(s){var n=parseFloat(String(s).replace(/[^0-9.]/g,""));return isNaN(n)?0:n};
  var fmt=function(n){return (Number(n)||0).toLocaleString("en-US",{maximumFractionDigits:2})};
  var fmt2=function(n){return (Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})};
  var save=function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
  var esc=function(t){return String(t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")};

  function totals(){
    var sub=0;S.items.forEach(function(it){sub+=num(it.cost)*num(it.qty)});
    var bal=sub+(S.taxMode==="balance"?-1:1)*num(S.tax);
    $("total").textContent=fmt2(sub);$("bal").textContent=fmt2(bal);$("boxTotal").textContent=fmt(bal);
    save();
  }

  function renderRows(){
    var h="";
    S.items.forEach(function(it,i){
      h+='<div class="tr" data-i="'+i+'">'+
        '<div class="d"><input data-f="item" value="'+esc(it.item)+'" aria-label="Description"><input class="s" data-f="sub" value="'+esc(it.sub||"")+'" aria-label="Sub description"></div>'+
        '<div class="c"><span>₦</span><input data-f="cost" inputmode="decimal" value="'+fmt(it.cost)+'" aria-label="Unit cost"></div>'+
        '<div class="q"><input data-f="qty" inputmode="decimal" value="'+esc(it.qty)+'" aria-label="Quantity"></div>'+
        '<div class="a">₦<span data-amt>'+fmt(num(it.cost)*num(it.qty))+'</span></div>'+
        '<button class="del" title="Remove item" aria-label="Remove item">×</button></div>';
    });
    for(var k=S.items.length;k<5;k++)h+='<div class="tr fill"></div>';
    $("rows").innerHTML=h;
    totals();
  }

  $("rows").addEventListener("input",function(e){
    var row=e.target.closest(".tr");if(!row||!row.dataset.i)return;
    var it=S.items[+row.dataset.i],f=e.target.dataset.f;
    if(f==="item"||f==="sub")it[f]=e.target.value;else it[f]=num(e.target.value);
    row.querySelector("[data-amt]").textContent=fmt(num(it.cost)*num(it.qty));
    totals();
  });
  $("rows").addEventListener("focusout",function(e){
    if(e.target.dataset&&e.target.dataset.f==="cost")e.target.value=fmt(S.items[+e.target.closest(".tr").dataset.i].cost);
  });
  $("rows").addEventListener("click",function(e){
    if(!e.target.classList.contains("del"))return;
    S.items.splice(+e.target.closest(".tr").dataset.i,1);renderRows();
  });

  function fill(){
    FIELDS.forEach(function(id){$(id).value=S[id]||""});
    $("tax").value=fmt(S.tax);
  }
  FIELDS.forEach(function(id){$(id).addEventListener("input",function(){S[id]=$(id).value;save()})});
  $("tax").addEventListener("input",function(){S.tax=num($("tax").value);totals()});
  $("tax").addEventListener("blur",function(){$("tax").value=fmt(S.tax)});
  $("taxMode").addEventListener("change",function(){S.taxMode=$("taxMode").value;totals();});

  $("add").onclick=function(){
    S.items.push({item:"",sub:"",cost:0,qty:1});renderRows();
    var ins=$("rows").querySelectorAll('input[data-f="item"]');ins[ins.length-1].focus();
  };
  function twoStep(btn,action){
    var t=null,orig=btn.textContent;
    btn.onclick=function(){
      if(t){clearTimeout(t);t=null;btn.textContent=orig;action();return;}
      btn.textContent="Click again to confirm";
      t=setTimeout(function(){t=null;btn.textContent=orig},4000);
    };
  }
  function newInvoice(){
    var seq=S.nextSeq||100,n=String(seq);while(n.length<5)n="0"+n;
    S.inv="SJG"+n;S.nextSeq=seq+1;
    var d=new Date(),p=function(x){return String(x).length<2?"0"+x:String(x)};
    S.date=p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear();
    S.name="";S.phone="";S.tax=0;S.items=[{item:"",sub:"",cost:0,qty:1}];
    fill();renderRows();
  };
  $("print").onclick=function(){window.print()};
  $("preview").onclick=function(){
    var on=document.body.classList.toggle("preview");
    $("preview").textContent=on?"Edit":"Preview";
  };
  twoStep($("newInv"),newInvoice);
  twoStep($("reset"),function(){var q=S.nextSeq||100;S=JSON.parse(JSON.stringify(DEFAULTS));S.nextSeq=q;fill();renderRows();});

  fill();renderRows();
})();
</script>
